<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Client website previews</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
    main{max-width:920px;margin:0 auto;padding:32px 20px 64px}
    h1{margin:0 0 8px;font-size:28px}
    p{color:#bbb;margin:0 0 24px}
    .grid{display:grid;gap:12px}
    .card{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:14px;background:#1c1c1c;color:#fff;text-decoration:none;border:1px solid #333}
    .card:hover{border-color:#ff5b00}
    .card span{color:#9ad;font-size:13px;word-break:break-all}
  </style>
</head>
<body>
  <main>
    <h1>Client website previews</h1>
    <p>These links open the public asoldi.com snapshot. No login needed.</p>
    <div class="grid" id="grid"><p>Loading…</p></div>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, function (char) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
      });
    }
    fetch('/api/public/previews', { cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var items = Array.isArray(data && data.items) ? data.items : [];
        var grid = document.getElementById('grid');
        if (!items.length) {
          grid.innerHTML = '<p>No public website previews yet.</p>';
          return;
        }
        grid.innerHTML = items.map(function (item) {
          var name = escapeHtml(item.name || 'Website');
          var url = escapeHtml(item.url || '');
          return '<a class="card" href="' + url + '" target="_blank" rel="noopener noreferrer"><strong>' + name + '</strong><span>' + url + '</span></a>';
        }).join('');
      })
      .catch(function () {
        document.getElementById('grid').innerHTML = '<p>Could not load the preview list. Open a /sales-preview/ link directly.</p>';
      });
  </script>
</body>
</html>
